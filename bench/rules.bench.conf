# Rules used by bench/*.py. Each script uses its own path and a fresh X-User-Id per run,
# so counts left over from an earlier run never leak into a new measurement.
# name    method path       key_by            algo             limit       window_ms  fail
race      *      /race      header:X-User-Id  fixed_window     100         10000      closed
accuracy  *      /accuracy  header:X-User-Id  sliding_counter  200         2000       closed
overhead  *      /overhead  header:X-User-Id  sliding_counter  1000000000  60000      open
deny      *      /deny      ip                fixed_window     1           60000      closed
chaos     *      /chaos     header:X-User-Id  sliding_counter  10          1000       local
